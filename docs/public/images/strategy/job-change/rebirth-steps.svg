<text x="67" y="134" font-size="12" fill="#5e6a7e">准备 1,285,000 Zeny</text>
<path d="M43 148v9m-4-4 4 4 4-4" stroke="#8b9bb1" stroke-width="2" fill="none"/>
<rect x="20" y="160" width="440" height="78" rx="10" fill="white" stroke="#dce3ee"/>
<circle cx="43" cy="184" r="13" fill="#345ec4"/>
<text x="43" y="189" text-anchor="middle" font-size="14" fill="white">2</text>
<text x="67" y="184" font-size="16" font-weight="600" fill="#24334a">阅读伊米尔之书</text>
<text x="67" y="205" font-size="13" fill="#3d5c91">yuno_in02 · 93,207</text>
<text x="67" y="224" font-size="12" fill="#5e6a7e">完成阅读后前往心脏</text>
