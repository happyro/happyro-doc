<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438" role="img" aria-labelledby="title desc">
<title id="title">转生：四个关键地点</title>
<desc id="desc">捐赠，yuno_in02 · 88,164，准备 1,285,000 Zeny；阅读伊米尔之书，yuno_in02 · 93,207，完成阅读后前往心脏；伊米尔之心，yuno_in05 · 49,43，经 NPC 进入英灵殿；女武神，valkyrie · 48,86，负重、剩余 Zeny 清零；解除手推车、骑乘与猎鹰。流程示意，不代表地图路线。</desc>
<rect width="480" height="438" rx="16" fill="#f5f7fb"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
