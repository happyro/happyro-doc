<text x="67" y="274" font-size="16" font-weight="600" fill="#24334a">伊米尔之心</text>
<text x="67" y="295" font-size="13" fill="#3d5c91">yuno_in05 · 49,43</text>
<text x="67" y="314" font-size="12" fill="#5e6a7e">经 NPC 进入英灵殿</text>
<path d="M43 328v9m-4-4 4 4 4-4" stroke="#8b9bb1" stroke-width="2" fill="none"/>
<rect x="20" y="340" width="440" height="78" rx="10" fill="white" stroke="#dce3ee"/>
<circle cx="43" cy="364" r="13" fill="#345ec4"/>
<text x="43" y="369" text-anchor="middle" font-size="14" fill="white">4</text>
<text x="67" y="364" font-size="16" font-weight="600" fill="#24334a">女武神</text>
<text x="67" y="385" font-size="13" fill="#3d5c91">valkyrie · 48,86</text>
<text x="67" y="404" font-size="12" fill="#5e6a7e">负重、剩余 Zeny 清零；解除手推车、骑乘与猎鹰</text>
