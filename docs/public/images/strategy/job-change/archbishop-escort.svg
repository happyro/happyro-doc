<desc id="desc">领取并召唤第一名化身，job3_arch02 · 起点，全程保护化身，整场限时 10 分钟；击败第一只噩梦，113,327，解除第一名化身，再领第二张卷轴；护送并击败第二只噩梦，244,46，领取号角与疲惫战士的意志；返回并完成号角剧情，279,234 附近，沿道路返回；读完对话完成转职。流程示意，不代表地图路线。</desc>
