<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 744" role="img" aria-labelledby="title"><title id="title">自动战斗主流程示意，不是游戏界面截图</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="480" height="744" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#1e293b"><text x="240" y="35" text-anchor="middle" font-size="22">自动战斗主循环</text><rect x="30" y="58" width="420" height="78" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="240" y="87" text-anchor="middle" font-size="19">手动开启自动战斗</text><text x="240" y="114" text-anchor="middle" font-size="15">等待服务端下发搜怪上限</text><path d="M240 137v21" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="161" width="420" height="78" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="240" y="190" text-anchor="middle" font-size="19">寻找目标</text><text x="240" y="217" text-anchor="middle" font-size="15">同时满足种类、范围与可接近条件</text><path d="M240 240v21" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="264" width="420" height="78" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="240" y="293" text-anchor="middle" font-size="19">接近并攻击</text><text x="240" y="320" text-anchor="middle" font-size="15">选择可用技能，必要时普通攻击</text><path d="M240 343v21" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="367" width="420" height="78" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="240" y="396" text-anchor="middle" font-size="19">当前目标结束</text><text x="240" y="423" text-anchor="middle" font-size="15">若开启拾取，限时处理本轮掉落</text><path d="M240 446v21" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="470" width="420" height="78" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="240" y="499" text-anchor="middle" font-size="19">重新寻找目标</text><text x="240" y="526" text-anchor="middle" font-size="15">没有目标和可拾取物品时等待</text><path d="M240 549v21" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="573" width="420" height="78" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="240" y="602" text-anchor="middle" font-size="19">按设置随机瞬移</text><text x="240" y="629" text-anchor="middle" font-size="15">有权限且满足冷却；成功后继续循环</text><text x="240" y="690" text-anchor="middle" font-size="16">找到新目标 → 回到接近并攻击</text><text x="240" y="718" text-anchor="middle" font-size="15">未启用瞬移或条件不满足 → 留在原地等待</text></g></svg>
