<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 544" role="img" aria-labelledby="title"><title id="title">活动范围与搜怪范围的关系示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="500" height="544" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#1e293b"><text x="250" y="32" text-anchor="middle" font-size="21">目标必须同时落在两个范围内</text><rect x="50" y="60" width="360" height="360" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="230" y="156" width="168" height="168" fill="#bae6fd" fill-opacity="0.8" stroke="#0284c7" stroke-width="2"/><circle cx="230" cy="240" r="6" fill="#b45309"/><circle cx="314" cy="240" r="7" fill="#0369a1"/><circle cx="365" cy="200" r="7" fill="#15803d"/><circle cx="125" cy="320" r="7" fill="#64748b"/><text x="230" y="264" text-anchor="middle" font-size="14">活动起点</text><text x="321" y="288" text-anchor="middle" font-size="14">当前位置</text><text x="344" y="185" text-anchor="middle" font-size="14">可选目标</text><text x="135" y="345" text-anchor="middle" font-size="14">超出搜怪范围</text><path d="M50 390h360" stroke="#b45309" stroke-dasharray="5 5"/><text x="250" y="455" text-anchor="middle" font-size="17">黄色：活动范围，默认距起点 30 格</text><text x="250" y="486" text-anchor="middle" font-size="17">蓝色：搜怪范围，默认距当前位置 14 格</text><text x="250" y="519" text-anchor="middle" font-size="14">方形边长是范围数值的两倍；图中省略障碍物</text></g></svg>
